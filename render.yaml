databases:
  - name: signal-demo-db
    plan: free
    databaseName: signal
    user: signal

services:
  - type: web
    name: signal-dashboard-demo
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements-demo.txt
    startCommand: bash scripts/start_demo.sh
    healthCheckPath: /api/demo
    envVars:
      - key: SIGNAL_DEMO
        value: "1"
      - key: PYTHONPATH
        value: "."
      - key: DATABASE_URL
        fromDatabase:
          name: signal-demo-db
          property: connectionString
