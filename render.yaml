databases:
  - name: signal-demo-db
    plan: free
    databaseName: signal
    user: signal

services:
  - type: web
    name: signal-dashboard-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    healthCheckPath: /api/demo
    envVars:
      - key: SIGNAL_DEMO
        value: "1"
      - key: PYTHONPATH
        value: "."
      - key: DATABASE_URL
        fromDatabase:
          name: signal-demo-db
          property: connectionString
